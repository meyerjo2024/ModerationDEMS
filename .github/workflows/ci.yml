name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: dems, POSTGRES_PASSWORD: dems, POSTGRES_DB: dems }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dems" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dems:dems@localhost:5432/dems
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-ci-secret
      SEED_ADMIN_PASSWORD: ci-demo-password-123
      SEED_DEMO_DATA: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx prisma migrate deploy && npm run db:seed
      - run: npm run build
      - name: End-to-end smoke test (full 5-phase lifecycle)
        env: { PASSWORD: ci-demo-password-123 }
        run: |
          npm run start &
          npx --yes wait-on http://localhost:3000/api/health
          node scripts/smoke.mjs
