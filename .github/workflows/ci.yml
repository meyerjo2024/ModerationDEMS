name: CI
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: dems, POSTGRES_PASSWORD: dems, POSTGRES_DB: dems }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dems" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "gd, zip, intl, pdo_pgsql, pdo_sqlite" }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - name: Tests (${{ matrix.db }})
        env:
          DB_CONNECTION: ${{ matrix.db == 'pgsql' && 'pgsql' || 'sqlite' }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ${{ matrix.db == 'pgsql' && 'dems' || ':memory:' }}
          DB_USERNAME: dems
          DB_PASSWORD: dems
        run: php artisan test
