# Render Blueprint — New + → Blueprint → select this repo.
# Database: Supabase (external). Create a project there and paste its two connection strings below.

services:
  - type: web
    name: moderation-dems
    runtime: node
    plan: starter
    region: oregon           # pick the region closest to your Supabase project
    buildCommand: npm ci && npm run build   # build also runs migrations + HOD seed
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true         # deploy on every push to the linked branch
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL        # Supabase transaction pooler (port 6543, ?pgbouncer=true&connection_limit=1)
        sync: false
      - key: DIRECT_URL          # Supabase session pooler (port 5432) — used for migrations
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_URL
        sync: false          # e.g. https://moderation-dems.onrender.com
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        value: Head of Department
      - key: INSTITUTION_NAME
        sync: false
      - key: STORAGE_DRIVER
        value: db            # or "s3" + the S3_* variables below
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
