# Render Blueprint — New + → Blueprint → select this repo.
# Database: Supabase (external PostgreSQL). Paste its Session-pooler connection string into DB_URL.
services:
  - type: web
    name: moderation-dems
    runtime: docker
    plan: starter
    region: oregon            # pick the region closest to your Supabase project
    healthCheckPath: /health
    autoDeploy: true          # deploy on every push to the linked branch
    envVars:
      - { key: APP_NAME, value: Moderation DEMS }
      - { key: APP_ENV, value: production }
      - { key: APP_DEBUG, value: "false" }
      - { key: APP_KEY, sync: false }            # run: php artisan key:generate --show
      - { key: APP_URL, sync: false }            # e.g. https://moderation-dems.onrender.com
      - { key: PORT, value: "8080" }             # the port the container listens on
      - { key: LOG_CHANNEL, value: stderr }
      - { key: DB_CONNECTION, value: pgsql }
      - { key: DB_URL, sync: false }             # Supabase → Connection string → Session pooler (port 5432)
      - { key: DB_SSLMODE, value: require }
      - { key: SESSION_DRIVER, value: database }
      - { key: SESSION_SECURE_COOKIE, value: "true" }
      - { key: SESSION_LIFETIME, value: "480" }
      - { key: CACHE_STORE, value: file }
      - { key: QUEUE_CONNECTION, value: sync }
      - { key: DEMS_SEED_EMAIL, sync: false }
      - { key: DEMS_SEED_PASSWORD, sync: false } # 10+ characters: becomes the first HOD login
      - { key: INSTITUTION_NAME, sync: false }
      # E-mail is optional for now: with MAIL_MAILER=log (default) the PDF is just available to download.
