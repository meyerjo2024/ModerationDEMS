# Render Blueprint — New + → Blueprint → select this repo.
databases:
  - name: dems-db
    plan: basic-256mb        # use "free" for a 30-day trial database
    databaseName: dems
    user: dems

services:
  - type: web
    name: moderation-dems
    runtime: node
    plan: starter
    region: oregon           # keep in the same region as the database
    buildCommand: npm ci && npm run build   # build also runs migrations + HOD seed
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true         # deploy on every push to the linked branch
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: dems-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_URL
        sync: false          # e.g. https://moderation-dems.onrender.com
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        value: Head of Department
      - key: INSTITUTION_NAME
        sync: false
      - key: STORAGE_DRIVER
        value: db            # or "s3" + the S3_* variables below
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
